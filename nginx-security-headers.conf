add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), focus-without-user-activation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-jOqrn6xbt6VH8nsUC1w7Usks/nmYBaKDNY41Pv/qtjs='; style-src 'self' 'sha256-ma+mr59P2nQ7pj9GwRxHFbem+/Sh3upT9i7sbV6EZgE='; font-src 'self'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none';" always;
