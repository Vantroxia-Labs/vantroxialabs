server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative behind Traefik TLS termination
    absolute_redirect off;

    # Canonical apex domain redirect
    if ($host = www.vantroxialabs.com) {
        return 301 https://vantroxialabs.com$request_uri;
    }

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|svg|png|jpe?g|webp|woff2?)$ {
        expires 6M;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Avoid soft-404s by returning HTTP 404 for unknown routes
    location / {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
